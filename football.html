<body>
    <div class="overlay"></div>
    <div class="form-container">
        <h2>Book Your Football Match Slot</h2>
        <form id="football-booking-form">
            <label for="teamName">Team Name:</label>
            <input type="text" id="teamName" name="teamName" required oninput="this.value = this.value.toUpperCase()">

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required>

            <label for="time">Time Slot (Morning, AfterNoon, Evening):</label>
            <select id="time" name="time" required>
                <option value="Morning">Morning</option>
                <option value="AfterNoon">AfterNoon</option>
                <option value="Evening">Evening</option>
            </select>

            <label for="playTime">Duration (in minutes):</label>
            <input type="number" id="playTime" name="playTime" min="1" max="90" required>

            <button type="submit">Book Now</button>
        </form>
        <p id="response-message"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script>
        // Initialize EmailJS
        emailjs.init('_8c6xfyglLGp6NlQO'); // Replace with your EmailJS public key

        const form = document.getElementById('football-booking-form');
        const responseMessage = document.getElementById('response-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            // Generate a unique booking code
            const bookingCode = `FB-${Math.random().toString(36).substring(2, 8).toUpperCase()}`;
            data.bookingCode = bookingCode;

            // Send email using EmailJS
            emailjs.send('service_4234g7f', 'template_7r5gw5s', {
                teamName: data.teamName,
                playTime: data.playTime, // Duration in minutes
                date: data.date,
                time: data.time, // Morning, AfterNoon, or Evening
                bookingCode: data.bookingCode,
                email: data.email, // Pass the user's email
            })
            .then(() => {
                responseMessage.textContent = 'Booking successful! A confirmation email has been sent.';
                responseMessage.style.color = 'green';
                form.reset();
            })
            .catch((error) => {
                console.error('EmailJS error:', error);
                responseMessage.textContent = 'An error occurred while sending the confirmation email.';
                responseMessage.style.color = 'red';
            });
        });

        // Disable past dates
        const dateInput = document.getElementById('date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.setAttribute('min', today);

        // Array of background images
        const backgrounds = [
            'url("JK Palms booking new/jk5.jpg")',
            'url("JK Palms booking new/jk1.jpg")', // Replace with actual image paths
            'url("JK Palms booking new/jk2.jpg")',
            'url("JK Palms booking new/jk3.jpg")',
            'url("JK Palms booking new/jk4.jpg")',
            'url("JK Palms booking new/469572074_1085863476566045_5119035953744615626_n.jpg")'
        ];

        let currentIndex = 0;

        // Function to change background image
        function changeBackground() {
            document.body.style.backgroundImage = backgrounds[currentIndex];
            currentIndex = (currentIndex + 1) % backgrounds.length;
        }

        // Set interval for changing background every 2 seconds (2000 ms)
        setInterval(changeBackground, 3500);

        // Initialize the first background image
        changeBackground();
    </script>
