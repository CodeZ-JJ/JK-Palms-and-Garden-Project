<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JK Palms & Garden - Booking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 100vh;
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #fff;
            transition: background 1s ease-in-out;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .form-container {
            position: relative;
            width: 90%;
            max-width: 400px;
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            z-index: 2;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
            color: #555;
        }
        input, select, button {
            width: calc(100% - 20px);
            padding: 10px;
            margin: 0 auto 15px auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box;
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }
        button:hover {
            background-color: #45a049;
        }
        #response-message {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="overlay"></div>
    <div class="form-container">
        <h2>Book Your Slot</h2>
        <form id="booking-form">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required>

            <label for="time">Time Slot:</label>
            <select id="time" name="time" required>
                <option value="" disabled selected>Select a time slot</option>
                <option value="9:00 AM - 11:00 AM">9:00 AM - 11:00 AM</option>
                <option value="11:00 AM - 1:00 PM">11:00 AM - 1:00 PM</option>
                <option value="1:00 PM - 3:00 PM">1:00 PM - 3:00 PM</option>
                <option value="3:00 PM - 5:00 PM">3:00 PM - 5:00 PM</option>
            </select>

            <button type="submit">Book Now</button>
        </form>

        <p id="response-message"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script>
        // Initialize EmailJS
        emailjs.init('_8c6xfyglLGp6NlQO'); // Replace with your EmailJS public key

        const form = document.getElementById('booking-form');
        const responseMessage = document.getElementById('response-message');
        const dateInput = document.getElementById('date');

        // Set the minimum date for the date input to today's date
        const today = new Date().toISOString().split('T')[0];
        dateInput.setAttribute('min', today);

        form.addEventListener('submit', (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            // Check if the selected date and time slot is already booked
            const bookings = JSON.parse(localStorage.getItem('bookings')) || [];
            const isClashing = bookings.some(
                (booking) => booking.date === data.date && booking.time === data.time
            );

            if (isClashing) {
                responseMessage.textContent = 'The selected date and time slot is already booked.';
                responseMessage.style.color = 'red';
                return;
            }

            // Generate a unique booking code
            const bookingCode = `JK-${Math.random().toString(36).substring(2, 8).toUpperCase()}`;
            data.bookingCode = bookingCode;

            // Save the booking to localStorage
            bookings.push({ date: data.date, time: data.time });
            localStorage.setItem('bookings', JSON.stringify(bookings));

            // Send confirmation email using EmailJS
            emailjs.send('service_4234g7f', 'template_7nsfx49', {
                name: data.name,
                email: data.email,
                date: data.date,
                time: data.time,
                bookingCode: data.bookingCode,
                email: data.email, // The user's email
                adminEmail: 'alphacodealph@gmail.com', // Replace with your forwarding email
            })
            .then(() => {
                responseMessage.textContent = 'Booking successful! A confirmation email has been sent.';
                responseMessage.style.color = 'green';
                form.reset();
            })
            .catch((error) => {
                console.error('EmailJS error:', error);
                responseMessage.textContent = 'An error occurred while sending the confirmation email.';
                responseMessage.style.color = 'red';
            });
        });

        // Array of background images
        const backgrounds = [
            'url("j1.jpg")',
            'url("j2.jpg")',
            'url("j3.jpg")',
            'url("j4.jpg")',
            'url("j5.jpg")',
            'url("j7.jpg")',
            'url("j8.jpg")',
            'url("j6.jpg")'
        ];

        let currentIndex = 0;

        // Function to change background image
        function changeBackground() {
            document.body.style.backgroundImage = backgrounds[currentIndex];
            currentIndex = (currentIndex + 1) % backgrounds.length;
        }

        // Set interval for changing background every 3.5 seconds
        setInterval(changeBackground, 2000);

        // Initialize the first background image
        changeBackground();
    </script>
</body>
</html>
