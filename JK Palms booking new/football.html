<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JK Palms & Garden - Football Booking</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            height: 110vh; /* Use the full height of the viewport */
            background-size: cover;
            display: flex;
            justify-content: center;
            align-items: center; /* Centers the content vertically */
            color: #fff;
            transition: background 1s ease-in-out; /* Smooth transition for background change */
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }
        .form-container {
            position: relative;
            width: 90%; /* Make the container responsive */
            max-width: 400px; /* Limit maximum width */
            background-color: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 10px;
            z-index: 2;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.3);
        }
        .form-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #333;
        }
        label {
            display: block;
            margin: 10px 0 5px;
            font-weight: bold;
            color: #555;
        }
        input, select, button {
            width: calc(100% - 20px); /* Ensure padding doesn't cause overflow */
            padding: 10px;
            margin: 0 auto 15px auto;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
            box-sizing: border-box; /* Makes padding count within the width */
        }
        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
            font-size: 18px;
        }
        button:hover {
            background-color: #45a049;
        }
        #response-message {
            text-align: center;
            margin-top: 10px;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <!-- Spinner Start -->
    <div id="spinner" class="show bg-white position-fixed translate-middle w-100 vh-100 top-50 start-50 d-flex align-items-center justify-content-center">

    <!-- Spinner End -->

    <!-- Navbar & Hero Start -->
    <div class="container-fluid nav-bar sticky-top px-4 py-2 py-lg-0">
        <nav class="navbar navbar-expand-lg navbar-light">
            <a href="" style="justify-content: center; align-items: center; text-align: center;" class="navbar-brand p-0">

            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarCollapse">
                <span class="fa fa-bars"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarCollapse">
                <div class="navbar-nav mx-auto py-0">
                    <a href="index.html" class="nav-item nav-link active">Home</a>
                    <a href="about.html" class="nav-item nav-link">About</a>
                    <a href="service.html" class="nav-item nav-link">Service</a>
                    <a href="event.html" class="nav-item nav-link">Events</a>
            
                    <!-- Booking Dropdown -->
                    <div class="nav-item dropdown">
                        <a href="#" class="nav-link dropdown-toggle" data-bs-toggle="dropdown">Bookings</a>
                        <div class="dropdown-menu rounded-0 m-0">
                            <a href="JK Palms booking new/football.html" class="dropdown-item">Football Matches</a>
                            <a href="JK Palms booking new/palmyard.html" class="dropdown-item">Palm-Yard</a>

                    </div>
                </div>
                <div class="team-icon d-none d-xl-flex justify-content-center me-3">
                    <a class="btn btn-square btn-light rounded-circle mx-1" href="https://web.facebook.com/JKPalmsGarden/?_rdc=1&_rdr" target="_blank">
                        <i class="fab fa-facebook-f"></i>
                    </a>

            </div>
            
        </nav>
    </div>
    <!-- Navbar & Hero End -->
    <div class="overlay"></div>
    <div class="form-container">
        <h2>Book Your Football Match Slot</h2>
        <form id="football-booking-form">
            <label for="teamName">Team Name:</label>
            <input type="text" id="teamName" name="teamName" required oninput="this.value = this.value.toUpperCase()">

            <label for="email">Email Address:</label>
            <input type="email" id="email" name="email" required>

            <label for="date">Date:</label>
            <input type="date" id="date" name="date" required>

            <label for="time">Time Slot (Morning, AfterNoon, Evening):</label>
            <select id="time" name="time" required>
                <option value="Morning">Morning</option>
                <option value="AfterNoon">AfterNoon</option>
                <option value="Evening">Evening</option>
            </select>

            <label for="playTime">Duration (in minutes):</label>
            <input type="number" id="playTime" name="playTime" min="1" max="90" required>

            <button type="submit">Book Now</button>
        </form>
        <p id="response-message"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
    <script>
        // Initialize EmailJS
        emailjs.init('_8c6xfyglLGp6NlQO'); // Replace with your EmailJS public key

        const form = document.getElementById('football-booking-form');
        const responseMessage = document.getElementById('response-message');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const formData = new FormData(form);
            const data = Object.fromEntries(formData.entries());

            // Generate a unique booking code
            const bookingCode = `FB-${Math.random().toString(36).substring(2, 8).toUpperCase()}`;
            data.bookingCode = bookingCode;

            // Send email using EmailJS
            emailjs.send('service_4234g7f', 'template_7r5gw5s', {
                teamName: data.teamName,
                playTime: data.playTime, // Duration in minutes
                date: data.date,
                time: data.time, // Morning, AfterNoon, or Evening
                bookingCode: data.bookingCode,
                email: data.email, // Pass the user's email
            })
            .then(() => {
                responseMessage.textContent = 'Booking successful! A confirmation email has been sent.';
                responseMessage.style.color = 'green';
                form.reset();
            })
            .catch((error) => {
                console.error('EmailJS error:', error);
                responseMessage.textContent = 'An error occurred while sending the confirmation email.';
                responseMessage.style.color = 'red';
            });
        });

        // Disable past dates
        const dateInput = document.getElementById('date');
        const today = new Date().toISOString().split('T')[0];
        dateInput.setAttribute('min', today);

        // Array of background images
        const backgrounds = [
            'url("jk5.jpg")',
            'url("jk1.jpg")', // Replace with actual image paths
            'url("jk2.jpg")',
            'url("jk3.jpg")',
            'url("jk4.jpg")',
            'url("469572074_1085863476566045_5119035953744615626_n.jpg")'
        ];

        let currentIndex = 0;

        // Function to change background image
        function changeBackground() {
            document.body.style.backgroundImage = backgrounds[currentIndex];
            currentIndex = (currentIndex + 1) % backgrounds.length;
        }

        // Set interval for changing background every 2 seconds (2000 ms)
        setInterval(changeBackground, 3500);

        // Initialize the first background image
        changeBackground();
    </script>
</body>
</html>
